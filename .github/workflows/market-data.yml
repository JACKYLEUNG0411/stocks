name: Refresh market data

on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Yahoo Finance quotes
        run: python scripts/fetch_market_data.py
      - name: Publish updated data
        run: |
          git config user.name "signal-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market-data.json
          git diff --cached --quiet || git commit -m "chore: refresh market data"
          git push
